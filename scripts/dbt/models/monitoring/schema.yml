version: 2

models:
  - name: obs_kpis_daily
    description: "Daily KPI grain for dashboards."
    columns:
      - name: report_date
        tests: [not_null]
      - name: warehouse_name
        tests: [not_null]
      - name: product_name
        tests: [not_null]
      - name: total_orders
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_units_shipped
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_units_replenished
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: stock_turnover_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: obs_kpis_7d
    description: "7-day rolling KPIs for the observability dashboard."
    columns:
      - name: last_date
        tests: [not_null]
      - name: wk_orders
        tests: [not_null]
      - name: wk_units
        tests: [not_null]
      - name: avg_turnover
        tests: [not_null]

  - name: obs_freshness
    description: "Freshness of the Silver snapshot."
    columns:
      - name: freshness_hours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

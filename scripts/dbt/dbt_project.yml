name: 'logistics_demo'
version: '1.0'
profile: 'logistics_demo'

config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

seeds:
  logistics_demo:
    schema: master_data

models:
  logistics_demo:
    schema: "{{ target.schema }}"
      # Bronze models read from raw sources and materialize as views.
      bronze:
        materialized: view
      # Silver models transform raw data into clean, conformed tables.
      silver:
        materialized: table
      # Gold models build business marts from the conformed layer.
      gold:
        materialized: table

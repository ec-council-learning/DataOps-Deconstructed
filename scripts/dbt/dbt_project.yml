name: 'logistics_demo'
version: '1.0'
profile: 'logistics_demo'

config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  logistics_demo:
    # Use the target's schema for all models to respect environment‑specific
    # schemas set in profiles.yml.  In CI the orchestrator sets
    # DBT_TARGET_SCHEMA to `ci_<run_id>`; in dev/prod it defaults to `dev` or `prod`.
    +schema: "{{ target.schema }}"

    # Bronze models read from raw sources and materialize as views.
    bronze:
      +materialized: view

    # Silver models transform raw data into clean, conformed tables.
    silver:
      +materialized: table

    # Gold models build business marts from the conformed layer.
    gold:
      +materialized: table

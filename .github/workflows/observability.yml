name: Observability Metrics

# This workflow generates a Snowflake/DBT-backed Observability dashboard
# and publishes it to GitHub Pages. It follows the same structure and
# conventions as data_pipeline.yml (setup → workloads → notify).

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev/prod/ci)"
        required: false
        type: string
      extra_flags:
        description: "Optional flags or selectors"
        required: false
        type: string
      requirements_path:
        description: "Path to Python requirements file"
        required: false
        type: string
      bronze_schema:
        description: "Bronze (staging/seeds) schema containing STG_* and seed tables"
        required: false
        type: string
        default: "bronze"
    secrets:
      SNOWFLAKE_ACCOUNT: {required: false}
      SNOWFLAKE_USER: {required: false}
      SNOWFLAKE_PASSWORD: {required: false}
      SNOWFLAKE_ROLE: {required: false}
      SNOWFLAKE_WAREHOUSE: {required: false}
      SLACK_WEBHOOK_URL: {required: false}
      SNOWFLAKE_PRIVATE_KEY_B64: {required: false}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: {required: false}

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

jobs:
  # -----------------------------------------------------------------------------
  # Setup job: resolves the dbt environment and schema based on branch name.
  # Saves these values to outputs for later jobs.
  # -----------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      dbt_env: ${{ steps.set-env.outputs.DBT_ENVIRONMENT }}
      dbt_schema: ${{ steps.set-env.outputs.DBT_TARGET_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine dbt target (env/schema)
        id: set-env
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.ref }}"
          if [[ "$REF" == "refs/heads/main" ]]; then
            DBT_ENVIRONMENT=prod
            DBT_TARGET_SCHEMA=prod
          elif [[ "$REF" == "refs/heads/develop" ]]; then
            DBT_ENVIRONMENT=dev
            DBT_TARGET_SCHEMA=dev
          else
            ISSUE_ID=${{ github.run_id }}
            DBT_ENVIRONMENT=ci_cd
            DBT_TARGET_SCHEMA="ci_${ISSUE_ID}"
          fi
          echo "DBT_ENVIRONMENT=$DBT_ENVIRONMENT"       | tee -a "$GITHUB_ENV"
          echo "DBT_TARGET_SCHEMA=$DBT_TARGET_SCHEMA"   | tee -a "$GITHUB_ENV"
          echo "DBT_ENVIRONMENT=$DBT_ENVIRONMENT"     >> "$GITHUB_OUTPUT"
          echo "DBT_TARGET_SCHEMA=$DBT_TARGET_SCHEMA" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------------
  # Generate & Publish Observability Dashboard
  # -----------------------------------------------------------------------------
  observability:
    name: "📊 Observability Metrics"
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      # Snowflake / dbt
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      # Context (non-sensitive)
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GIT_SHA: ${{ github.sha }}
      DBT_PROFILES_DIR: .
      DBT_ENVIRONMENT: ${{ needs.setup.outputs.dbt_env }}
      DBT_TARGET_SCHEMA: ${{ needs.setup.outputs.dbt_schema }}
      BRONZE_SCHEMA: ${{ inputs.bronze_schema }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            ${{ inputs.requirements_path }}

      - name: Install Python dependencies
        if: inputs.requirements_path != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r "${{ inputs.requirements_path }}"

      - name: Install DBT dependencies
        working-directory: scripts/dbt
        shell: bash
        run: |
          set -euo pipefail
          dbt deps

      # === Aggregate publishing to a single GitHub Pages site ===

      # Pull the current gh-pages branch so we can preserve/extend what’s already published
      - name: Fetch current GitHub Pages (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      # Prime the working site directory with existing content (if any)
      - name: Seed working site from current gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          if [ -d gh-pages ]; then
            rsync -a --delete --exclude='.git' gh-pages/ _site/
          fi

      - name: Compute KPIs & DQ signals
        id: kpis
        shell: bash
        run: |
          set -euo pipefail
          ENV_SLUG="${DBT_ENVIRONMENT}"
          RUN_DIR="_site/${ENV_SLUG}/runs/${RUN_ID}"
          LATEST_DIR="_site/${ENV_SLUG}/latest"
          mkdir -p "${RUN_DIR}" "${LATEST_DIR}"

          python scripts/python/compute_metrics.py \
            --gold-schema   "gold" \
            --silver-schema "silver" \
            --bronze-schema "${BRONZE_SCHEMA}" \
            --sql-file "scripts/sql/kpi_rebuild_and_select.sql" \
            --out "dashboard_metrics.json"

          # keep a copy in the run folder (raw data)
          cp dashboard_metrics.json "${RUN_DIR}/dashboard_metrics.json"

          echo "kpis=$(jq -c '.' dashboard_metrics.json)" >> "$GITHUB_OUTPUT"
          echo "ENV_SLUG=${ENV_SLUG}" >> "$GITHUB_OUTPUT"
          echo "RUN_DIR=${RUN_DIR}"   >> "$GITHUB_OUTPUT"
          echo "LATEST_DIR=${LATEST_DIR}" >> "$GITHUB_OUTPUT"

      - name: Render Markdown & HTML (env/latest + env/runs/RUN_ID)
        shell: bash
        run: |
          set -euo pipefail
          ENV_SLUG="${{ steps.kpis.outputs.ENV_SLUG }}"
          RUN_DIR="${{ steps.kpis.outputs.RUN_DIR }}"
          LATEST_DIR="${{ steps.kpis.outputs.LATEST_DIR }}"
          data_file="${RUN_DIR}/dashboard_metrics.json"  # already copied there
          python - <<'PY'
          import json, markdown, os
          from datetime import datetime, timezone
          run_id   = os.getenv("RUN_ID")
          run_url  = os.getenv("RUN_URL")
          sha      = os.getenv("GIT_SHA")
          env_slug = os.getenv("ENV_SLUG")
          run_dir  = os.getenv("RUN_DIR")
          latest   = os.getenv("LATEST_DIR")
          data = json.load(open(f"{run_dir}/dashboard_metrics.json"))

          trend = (f"{data.get('order_trend_pct')}%"
                   if data.get('order_trend_pct') is not None else "n/a")
          fresh = (f"{data.get('freshness_hours')}h"
                   if data.get('freshness_hours') is not None else "n/a")

          md = f"""# Observability Dashboard — {env_slug}

          **Run:** [{run_id}]({run_url})  
          **Commit:** `{sha[:7]}`  
          **As of:** {datetime.now(timezone.utc).isoformat()}

          ## Business KPIs (Gold)
          - Week Orders: **{data.get('wk_orders','n/a')}**
          - Week Units Shipped: **{data.get('wk_units','n/a')}**
          - Avg Stock Turnover: **{data.get('avg_turnover','n/a')}**
          - Orders Trend vs last week: **{trend}**
          - Latest Date: **{data.get('last_date','n/a')}**

          ## Data Quality
          - Tests: **{data.get('tests_passed','0')} / {data.get('tests_total','0')}** passed (**{data.get('pass_rate_pct','0')}%**)
          - Freshness (silver snapshot): **{fresh}**
          - Anomaly Detected: **{':warning: YES' if data.get('anomaly_flag') else 'No'}**
          """

          os.makedirs(run_dir, exist_ok=True)
          os.makedirs(latest,  exist_ok=True)
          open(f"{run_dir}/dashboard.md","w").write(md)
          open(f"{run_dir}/index.html","w").write(markdown.markdown(md, extensions=['tables']))
          # update env/latest as a copy of this run
          open(f"{latest}/dashboard.md","w").write(md)
          open(f"{latest}/index.html","w").write(markdown.markdown(md, extensions=['tables']))
          PY
        env:
          ENV_SLUG: ${{ steps.kpis.outputs.ENV_SLUG }}
          RUN_DIR: ${{ steps.kpis.outputs.RUN_DIR }}
          LATEST_DIR: ${{ steps.kpis.outputs.LATEST_DIR }}

      - name: Generate dbt docs and copy to env/latest + run archive
        working-directory: scripts/dbt
        shell: bash
        run: |
          set -euo pipefail
          dbt docs generate --target "${DBT_ENVIRONMENT}"
          # copy artifacts to the site
          cd "${GITHUB_WORKSPACE}"
          ENV_SLUG="${{ steps.kpis.outputs.ENV_SLUG }}"
          RUN_DIR="${{ steps.kpis.outputs.RUN_DIR }}"
          LATEST_DIR="${{ steps.kpis.outputs.LATEST_DIR }}"
          mkdir -p "${RUN_DIR}/dbt-docs" "${LATEST_DIR}/dbt-docs"
          # core docs + manifest
          cp -R scripts/dbt/target/*.json "${RUN_DIR}/dbt-docs/"  2>/dev/null || true
          cp -R scripts/dbt/target/*.json "${LATEST_DIR}/dbt-docs/" 2>/dev/null || true
          cp -R scripts/dbt/target/manifest.json "${RUN_DIR}/dbt-docs/"  2>/dev/null || true
          cp -R scripts/dbt/target/manifest.json "${LATEST_DIR}/dbt-docs/" 2>/dev/null || true
          # static docs website (if produced)
          if [ -d scripts/dbt/target/docs ]; then
            cp -R scripts/dbt/target/docs/* "${RUN_DIR}/dbt-docs/"
            cp -R scripts/dbt/target/docs/* "${LATEST_DIR}/dbt-docs/"
          fi

      - name: Rebuild top-level index (link all envs & recent runs)
        shell: bash
        run: |
          set -euo pipefail
          # Simple index that lists envs and their latest links + the most recent 10 runs
          python - <<'PY'
          import os, pathlib, html
          root = pathlib.Path("_site")
          envs = sorted([p for p in root.iterdir() if p.is_dir()])
          def runs(envdir):
            rdir = envdir / "runs"
            if not rdir.exists(): return []
            # sort by directory name (RUN_ID); GitHub run_id grows over time
            return sorted([p for p in rdir.iterdir() if p.is_dir()], key=lambda x: x.name, reverse=True)[:10]
          parts = ["<h1>Observability Dashboards</h1><ul>"]
          for e in envs:
            parts.append(f"<li><b>{html.escape(e.name)}</b>: "
                         f"<a href='{e.name}/latest/'>latest</a>"
                         f" — runs: " + ", ".join(
                           f\"<a href='{e.name}/runs/{html.escape(r.name)}/'>{html.escape(r.name)}</a>\" for r in runs(e)
                         ) + "</li>")
          parts.append("</ul>")
          open("_site/index.html","w").write("\n".join(parts))
          PY

      - name: Deploy to GitHub Pages (single site, aggregated)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true


      - name: Slack — Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "✅ Observability Dashboard: Healthy Run" } },
                { "type": "section", "fields": [
                  { "type":"mrkdwn", "text":"*Run:* <${{ env.RUN_URL }}|${{ env.RUN_ID }}>" },
                  { "type":"mrkdwn", "text":"*Commit:* `${{ env.GIT_SHA }}`" }
                ]},
                { "type": "divider" },
                { "type": "section", "text": { "type":"mrkdwn",
                  "text": "*Business KPIs (7d)*\n• Orders: *${{ fromJson(steps.kpis.outputs.kpis).wk_orders }}*\n• Units: *${{ fromJson(steps.kpis.outputs.kpis).wk_units }}*\n• Turnover: *${{ fromJson(steps.kpis.outputs.kpis).avg_turnover }}*\n• Order trend: *${{ fromJson(steps.kpis.outputs.kpis).order_trend_pct != null && format('{0}%', fromJson(steps.kpis.outputs.kpis).order_trend_pct) || 'n/a' }}*" } },
                { "type": "section", "text": { "type":"mrkdwn",
                  "text": "*Data Quality*\n• Tests: *${{ fromJson(steps.kpis.outputs.kpis).tests_passed }} / ${{ fromJson(steps.kpis.outputs.kpis).tests_total }}* (*${{ fromJson(steps.kpis.outputs.kpis).pass_rate_pct }}%*)\n• Freshness: *${{ fromJson(steps.kpis.outputs.kpis).freshness_hours != null && format('{0}h', fromJson(steps.kpis.outputs.kpis).freshness_hours) || 'n/a' }}*\n• Anomaly: *${{ fromJson(steps.kpis.outputs.kpis).anomaly_flag && ':warning: YES' || 'No' }}*" } }
              ]
            }

      - name: Slack — Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            { "text": "🚨 Observability dashboard generation failed. See run ${{ env.RUN_URL }}." }

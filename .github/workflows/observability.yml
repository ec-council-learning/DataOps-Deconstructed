name: Observability Metrics (dbt Monitoring)

# Builds first-class dbt "monitoring" models and publishes a unified Pages site.
# Publishes per-environment under: /<env>/latest and archives runs at: /<env>/runs/<RUN_ID>/

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev/prod/ci)"
        required: false
        type: string
      extra_flags:
        description: "Optional flags/selectors for dbt"
        required: false
        type: string
      requirements_path:
        description: "Path to Python requirements file (for Snowflake connector, etc.)"
        required: false
        type: string
    secrets:
      SNOWFLAKE_ACCOUNT: {required: false}
      SNOWFLAKE_USER: {required: false}
      SNOWFLAKE_PASSWORD: {required: false}
      SNOWFLAKE_ROLE: {required: false}
      SNOWFLAKE_WAREHOUSE: {required: false}
      SLACK_WEBHOOK_URL: {required: false}
      SNOWFLAKE_PRIVATE_KEY_B64: {required: false}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: {required: false}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_metrics_dashboard:
    runs-on: ubuntu-latest
    env:
      # Snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      # Context
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GIT_SHA: ${{ github.sha }}
      DBT_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/scripts/dbt
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            ${{ inputs.requirements_path }}

      - name: Install Python deps (connector, markdown, jq)
        if: inputs.requirements_path != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r "${{ inputs.requirements_path }}"

      - name: Install dbt packages
        working-directory: scripts/dbt
        shell: bash
        run: |
          set -euo pipefail
          dbt deps

      # Generate dynamic CSV seed files
      - name: Generate Dynamic CSV Seed Files
        run: python scripts/python/create_seed.py

      # Build only the monitoring area (and artifacts if you chose to include that dependency)
      - name: Build monitoring models
        working-directory: scripts/dbt
        shell: bash
        run: |
          set -euo pipefail
          test -f profiles.yml
          dbt build --select monitoring+ ${{ inputs.extra_flags }} --target "${DBT_ENVIRONMENT}"

      # Pull current gh-pages content so we can publish a single, cumulative site
      - name: Fetch current GitHub Pages (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Seed working site from current gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          if [ -d gh-pages ]; then
            rsync -a --delete --exclude='.git' gh-pages/ _site/
          fi

      # Query the warehouse monitoring tables and produce a single JSON for rendering
      - name: Export metrics from monitoring schema
        id: kpis
        shell: bash
        run: |
          set -euo pipefail
          ENV_SLUG="${DBT_ENVIRONMENT}"
          RUN_DIR="_site/${ENV_SLUG}/runs/${RUN_ID}"
          LATEST_DIR="_site/${ENV_SLUG}/latest"
          mkdir -p "${RUN_DIR}" "${LATEST_DIR}"

          python - <<'PY'
          import os, json
          import snowflake.connector as sf

          acct = os.getenv("SNOWFLAKE_ACCOUNT")
          user = os.getenv("SNOWFLAKE_USER")
          pwd  = os.getenv("SNOWFLAKE_PASSWORD")
          role = os.getenv("SNOWFLAKE_ROLE")
          wh   = os.getenv("SNOWFLAKE_WAREHOUSE")

          conn = sf.connect(account=acct, user=user, password=pwd, role=role, warehouse=wh)
          cs = conn.cursor()

          # 7d KPIs
          cs.execute("""
            select last_date, wk_orders, wk_units, avg_turnover
            from logistics_demo.monitoring.obs_kpis_7d
          """)
          last_date, wk_orders, wk_units, avg_turnover = cs.fetchone()

          # Freshness
          cs.execute("""
            select freshness_hours
            from logistics_demo.monitoring.obs_freshness
          """)
          freshness_hours = cs.fetchone()[0]

          # Preview rows (top 10 by latest date)
          cs.execute("""
            select report_date, warehouse_name, product_name, category,
                   total_orders, total_units_shipped, total_units_replenished,
                   stock_turnover_ratio
            from logistics_demo.monitoring.obs_kpis_daily
            order by report_date desc, warehouse_name, product_name
            limit 10
          """)
          cols = [c[0] for c in cs.description]
          preview = [dict(zip(cols, r)) for r in cs.fetchall()]

          out = {
            "last_date": str(last_date) if last_date else None,
            "wk_orders": int(wk_orders or 0),
            "wk_units": int(wk_units or 0),
            "avg_turnover": float(avg_turnover or 0),
            "freshness_hours": freshness_hours,
            "preview": preview
          }
          os.makedirs(os.path.join("_site", os.getenv("DBT_ENVIRONMENT"), "runs", os.getenv("RUN_ID")), exist_ok=True)
          json.dump(out, open(os.path.join("_site", os.getenv("DBT_ENVIRONMENT"), "runs", os.getenv("RUN_ID"), "dashboard_metrics.json"), "w"), indent=2)

          cs.close(); conn.close()
          PY

          echo "ENV_SLUG=${ENV_SLUG}" >> "$GITHUB_OUTPUT"
          echo "RUN_DIR=${RUN_DIR}"   >> "$GITHUB_OUTPUT"
          echo "LATEST_DIR=${LATEST_DIR}" >> "$GITHUB_OUTPUT"

      - name: Render Markdown & HTML (env/latest + run archive)
        shell: bash
        run: |
          set -euo pipefail
          ENV_SLUG="${{ steps.kpis.outputs.ENV_SLUG }}"
          RUN_DIR="${{ steps.kpis.outputs.RUN_DIR }}"
          LATEST_DIR="${{ steps.kpis.outputs.LATEST_DIR }}"
          data_file="${RUN_DIR}/dashboard_metrics.json"

          python - <<'PY'
          import json, markdown, os
          from datetime import datetime, timezone

          env_slug = os.getenv("ENV_SLUG")
          run_id   = os.getenv("RUN_ID")
          run_url  = os.getenv("RUN_URL")
          sha      = os.getenv("GIT_SHA")
          run_dir  = os.getenv("RUN_DIR")
          latest   = os.getenv("LATEST_DIR")

          data = json.load(open(f"{run_dir}/dashboard_metrics.json"))
          trend = "n/a"  # can be derived inside monitoring if desired
          fresh = f"{data.get('freshness_hours')}h" if data.get('freshness_hours') is not None else "n/a"

          md = f"""# Observability Dashboard — {env_slug}

          **Run:** [{run_id}]({run_url})
          **Commit:** `{sha[:7]}`
          **As of:** {datetime.now(timezone.utc).isoformat()}

          ## Business KPIs (Gold, 7d)
          - Week Orders: **{data.get('wk_orders','n/a')}**
          - Week Units Shipped: **{data.get('wk_units','n/a')}**
          - Avg Stock Turnover: **{data.get('avg_turnover','n/a')}**
          - Orders Trend vs last week: **{trend}**
          - Latest Date: **{data.get('last_date','n/a')}**

          ## Data Freshness
          - Silver snapshot lag: **{fresh}**

          ## Daily Preview (latest 10)
          """  # noqa: E501

          # add preview table
          preview = data.get("preview", [])
          if preview:
              headers = preview[0].keys()
              # simple markdown table
              table = "| " + " | ".join(headers) + " |\n"
              table += "| " + " | ".join(["---"] * len(headers)) + " |\n"
              for row in preview:
                  table += "| " + " | ".join(str(row.get(h, "")) for h in headers) + " |\n"
              md += "\n" + table

          os.makedirs(run_dir, exist_ok=True)
          os.makedirs(latest,  exist_ok=True)
          open(f"{run_dir}/dashboard.md","w").write(md)
          open(f"{run_dir}/index.html","w").write(markdown.markdown(md, extensions=['tables']))
          open(f"{latest}/dashboard.md","w").write(md)
          open(f"{latest}/index.html","w").write(markdown.markdown(md, extensions=['tables']))
          PY
        env:
          ENV_SLUG: ${{ steps.kpis.outputs.ENV_SLUG }}
          RUN_DIR: ${{ steps.kpis.outputs.RUN_DIR }}
          LATEST_DIR: ${{ steps.kpis.outputs.LATEST_DIR }}

      - name: Rebuild top-level index (env latest + 10 recent runs)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, html
          root = pathlib.Path("_site")
          if not root.exists():
              root.mkdir(parents=True, exist_ok=True)

          envs = sorted([p for p in root.iterdir() if p.is_dir()])
          parts = ["<h1>Observability Dashboards</h1><ul>"]
          for env in envs:
              runs_dir = env / "runs"
              runs = []
              if runs_dir.exists():
                  runs = sorted([d for d in runs_dir.iterdir() if d.is_dir()],
                                key=lambda x: x.name, reverse=True)[:10]
              latest = f"{html.escape(env.name)}/latest/"
              run_links = ", ".join(f"<a href='{html.escape(env.name)}/runs/{html.escape(r.name)}/'>{html.escape(r.name)}</a>" for r in runs)
              parts.append(f"<li><b>{html.escape(env.name)}</b>: <a href='{latest}'>latest</a>"
                           + (f" — runs: {run_links}" if run_links else "") + "</li>")
          parts.append("</ul>")
          open("_site/index.html","w").write("\n".join(parts))
          PY

      - name: Deploy to GitHub Pages (single aggregated site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true

      - name: Slack — Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "blocks": [
                { "type": "header", "text": { "type": "plain_text", "text": "✅ Observability (dbt monitoring) published" } },
                { "type": "section", "fields": [
                  { "type":"mrkdwn", "text":"*Run:* <${{ env.RUN_URL }}|${{ env.RUN_ID }}>" },
                  { "type":"mrkdwn", "text":"*Commit:* `${{ env.GIT_SHA }}`" }
                ]}
              ]
            }

      - name: Slack — Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            { "text": "🚨 Observability (dbt monitoring) failed. See ${{ env.RUN_URL }}." }
